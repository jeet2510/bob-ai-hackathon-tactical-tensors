submission:
  title: "DVI Coordinator"

  problem_statement: >
    After the Balasore train collision, NDRF teams spent 72 hours manually
    cross-referencing more than 100 unidentified bodies against missing-person
    reports, with no unified matching system on-ground. The people affected are
    the identification commission doing the comparison by hand, and the families
    waiting at the mortuary gate for an answer.

  solution_summary: >
    A disaster-victim-identification triage tool that normalises multilingual
    ante-mortem and post-mortem form text into the INTERPOL item codebook,
    cross-references every body against every family report, and returns a
    ranked shortlist with per-feature reasoning plus the primary-identifier test
    that would settle it. It is decision support, never identification, and it
    declines to answer when no candidate is credible.

  key_features:
    - "Multilingual Stage-1 normalisation of English, Hindi and Marathi form text (including Latin-script code-mixing) into 12 INTERPOL item categories at 94.6% F1"
    - "Explainable evidence scoring weighted by INTERPOL reliability tier, with a per-feature table showing verdict, provenance and log-likelihood contribution for every point of score"
    - "Principled refusal: correctly declines on bodies with no ante-mortem partner, and reports its own false-refusal rate so the metric cannot be gamed"
    - "Hungarian one-to-one assignment across the whole incident, resolving look-alike clusters that tie under independent ranking"
    - "Built-in evaluation lab measuring the system against the dataset's hidden ground truth and published baseline, separating extraction quality from scorer quality"

  tech_stack:
    languages: ["PHP", "TypeScript"]
    frameworks: ["Laravel 13", "React 19", "Vite"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "IBM Granite"]
    databases: ["MySQL", "SQLite"]
    other: ["Laravel Sanctum", "PHPUnit", "Laravel Pint", "oxlint"]

  what_we_are_most_proud_of: >
    The evaluation lab, and what building it forced us to fix. Adding a
    false-refusal metric immediately showed the refusal rate could be gamed.
    Separating oracle runs from end-to-end runs showed an early "we beat the
    baseline" claim was comparing perfect input against imperfect. A hard cap on
    supportive evidence looked principled and quietly destroyed Recall@3, so it
    became a soft one. Measured like-for-like against the dataset's own
    baseline, the scorer reaches 75/86 first-choice against 72/86, 84/86 in the
    top three against 82/86, and correctly refuses 4 of the 12 bodies that have
    no partner where the baseline refuses none — with zero false exclusions.

  known_limitations: >
    The vision stage is specified but not implemented: photographs are ingested
    and displayed with provenance but contribute nothing to matching, and the
    dataset deliberately hides a fact in 42 photographs that text alone cannot
    see. The watsonx Granite extractor is wired and cache-backed but was never
    run against the live API, as no credentials were available; every published
    figure comes from the deterministic rules extractor. The dashboard has not
    been visually verified in a browser. Refusal remains the weakest area at 4
    of 12 correct, costing 4 false refusals out of 86. Weights are hand-set from
    INTERPOL tiers and tuned on the dev split, not learned. All results describe
    a synthetic dataset of 98 bodies, not real-world accuracy.

